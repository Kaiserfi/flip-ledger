plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.flipledger'
version = '1.0.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// Runs a RuneLite client with this plugin loaded (developer mode)
tasks.register('runClient', JavaExec) {
	group = 'application'
	description = 'Launch RuneLite with Flip Ledger loaded'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.flipledger.FlipLedgerPluginTest'
	jvmArgs = ['-ea']
	// --safe-mode skips your Plugin Hub plugins (and GPU) so only Flip Ledger and RuneLite's own plugins load
	args = ['--developer-mode', '--safe-mode']
}


// One file with RuneLite + Flip Ledger, for the "Flip Ledger RuneLite" shortcut (no IntelliJ needed).
// Rebuild it (Gradle task "devJar") after changing the plugin.
tasks.register('devJar', Jar) {
	group = 'application'
	description = 'Build build/libs/flip-ledger-runelite.jar for Launch RuneLite.bat'
	archiveFileName = 'flip-ledger-runelite.jar'
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	zip64 = true
	manifest { attributes 'Main-Class': 'com.flipledger.FlipLedgerPluginTest' }
	from sourceSets.test.output
	from sourceSets.main.output
	from({ sourceSets.test.runtimeClasspath.filter { it.name.endsWith('.jar') }.collect { zipTree(it) } }) {
		exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/*.EC', 'module-info.class'
	}
}
